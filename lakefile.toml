name = "formal-math-curriculum"
defaultTargets = ["FormalMath"]
fixedToolchain = true
requiresModuleSystem = true
allowNonModules = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.33.0"

[[lean_lib]]
name = "FormalMath"
globs = ["FormalMath.*"]
requiresModuleSystem = true
allowNonModules = false

[[lean_lib]]
name = "Quality"
roots = ["Quality"]
globs = ["Quality.AxiomAudit"]
requiresModuleSystem = true
allowNonModules = false

[[lean_lib]]
name = "QualityTests"
roots = ["QualityTests"]
globs = ["QualityTests.*"]
requiresModuleSystem = true
allowNonModules = false

[[lean_lib]]
name = "Traceability"
roots = ["Traceability"]
globs = ["Traceability.*"]
requiresModuleSystem = true
allowNonModules = false

[[lean_exe]]
name = "traceability"
root = "TraceabilityCli"
supportInterpreter = true
