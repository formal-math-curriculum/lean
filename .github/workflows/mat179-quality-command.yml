name: MAT-179 local quality command validation

on:
  push:
    branches:
      - agent/local-quality-command-surface

jobs:
  quality-command:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        shell: bash
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Validate complete local quality command surface
        shell: bash
        run: bash Quality/quality.sh all

      - name: Validate revision-bound report retrieval
        shell: bash
        run: |
          bash Quality/quality.sh report build | tee /tmp/build.report
          grep -Fq "status=pass" /tmp/build.report
          grep -Fq "git_sha=${GITHUB_SHA}" /tmp/build.report
          grep -Fq "lean_toolchain=leanprover/lean4:v4.33.0" /tmp/build.report
          grep -Fq "mathlib_revision=db584cd6d46c92f209a44c0f1c829460d327499d" /tmp/build.report
          bash Quality/quality.sh report proof | grep -Fq "status=pass"
          bash Quality/quality.sh report source | grep -Fq "status=pass"
          bash Quality/quality.sh report regression | grep -Fq "status=pass"
