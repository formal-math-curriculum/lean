name: mat188-cache-control

on:
  pull_request:

permissions:
  contents: read

jobs:
  cache-failure-is-nonsemantic:
    name: mat188 / cache failure remains nonsemantic
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ELAN_VERSION: v4.2.3
      ELAN_SHA256: df0b2b3a439961ffcbb3985214365ffe40f49bc871df04dff268c7d8e21ca8b2
      QUALITY_CACHE_FAIL_FIXTURE: "1"
    steps:
      - name: Checkout validation revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install checksum-pinned Elan
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/elan-x86_64-unknown-linux-gnu.tar.gz"
          curl --fail --location --retry 3 --output "$archive" \
            "https://github.com/leanprover/elan/releases/download/${ELAN_VERSION}/elan-x86_64-unknown-linux-gnu.tar.gz"
          echo "${ELAN_SHA256}  ${archive}" | sha256sum --check -
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/elan-init" -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Prove simulated cache failure does not fail environment gate
        shell: bash
        run: |
          set -euo pipefail
          output="$(bash Quality/quality.sh env 2>&1)"
          printf '%s\n' "$output"
          grep -F 'quality-env:cache:simulated-failure' <<<"$output"
          grep -F 'quality-env:cache:nonblocking-fail:exit=73' <<<"$output"
          grep -F 'quality-command:result:env:pass:exit=0' <<<"$output"

      - name: Prove semantic build remains valid with cache fixture enabled
        shell: bash
        run: bash Quality/quality.sh build
