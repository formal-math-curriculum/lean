name: MAT-182 M2.6 remediation validation

on:
  push:
    branches:
      - agent/m26-audit-remediation

jobs:
  remediation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        shell: bash
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Run complete remediated M2.6 quality surface
        shell: bash
        run: bash Quality/quality.sh all

      - name: Verify revision-bound reports and remediation signatures
        shell: bash
        run: |
          for dimension in build proof source regression; do
            bash Quality/quality.sh report "$dimension" > "/tmp/${dimension}.report"
            grep -Fq 'quality_report_version=2' "/tmp/${dimension}.report"
            grep -Fq 'status=pass' "/tmp/${dimension}.report"
            grep -Fq "git_sha=${GITHUB_SHA}" "/tmp/${dimension}.report"
            grep -Fq 'selected_environment_baseline=Quality/environment-baseline.env' "/tmp/${dimension}.report"
            grep -Fq 'lean_toolchain=leanprover/lean4:v4.33.0' "/tmp/${dimension}.report"
            grep -Fq 'mathlib_revision=db584cd6d46c92f209a44c0f1c829460d327499d' "/tmp/${dimension}.report"
          done

          source_log=$(sed -n 's/^log_path=//p' /tmp/source.report)
          grep -Fq 'source-quality:summary:mode=production;files=8;failures=0;advisories=0' "$source_log"

          regression_log=$(sed -n 's/^log_path=//p' /tmp/regression.report)
          grep -Fq 'quality-regression:expected-fail:trust-compiler' "$regression_log"
          grep -Fq 'quality-regression:expected-fail:test-source-missing-header' "$regression_log"
          grep -Fq 'quality-regression:expected-fail:warning-suppression' "$regression_log"
          grep -Fq 'quality-regression:expected-fail:standalone-environment-mismatch' "$regression_log"
          grep -Fq 'quality-regression:pass:optional-cache-failure-nonblocking' "$regression_log"
          grep -Fq 'quality-regression:pass:report-identity-collision-control' "$regression_log"
          grep -Fq 'quality-regression:summary:pass' "$regression_log"
