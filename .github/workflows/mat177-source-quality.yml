name: MAT-177 source quality validation

on:
  push:
    branches:
      - agent/source-quality-gates

jobs:
  source-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        shell: bash
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Verify environment and resolved dependency state
        shell: bash
        run: |
          lean --version
          lake --version
          lake update
          git diff --exit-code -- lean-toolchain lakefile.toml lake-manifest.json
          lake exe cache get

      - name: Strict production build
        shell: bash
        run: lake build --wfail FormalMath

      - name: Production source and API-boundary audit
        shell: bash
        run: bash Quality/check-source-quality.sh production

      - name: Source-quality positive control
        shell: bash
        run: |
          lake env lean --error=warning Quality/Fixtures/SourceQuality/Good.lean
          bash Quality/check-source-quality.sh fixture Quality/Fixtures/SourceQuality/Good.lean

      - name: Structural negative controls
        shell: bash
        run: |
          expect_fail() {
            local fixture="$1"
            local signature="$2"
            set +e
            output=$(bash Quality/check-source-quality.sh fixture "$fixture" 2>&1)
            status=$?
            set -e
            printf '%s\n' "$output"
            test "$status" -ne 0
            printf '%s\n' "$output" | grep -Fq "$signature"
          }

          expect_fail Quality/Fixtures/SourceQuality/UmbrellaImport.lean root-umbrella-import
          expect_fail Quality/Fixtures/SourceQuality/TransitiveImport.lean ungoverned-transitive-import
          expect_fail Quality/Fixtures/SourceQuality/InternalReexport.lean internal-reexport
          expect_fail Quality/Fixtures/SourceQuality/MissingHeader.lean source-header
          expect_fail Quality/Fixtures/SourceQuality/MissingModuleDoc.lean module-doc
