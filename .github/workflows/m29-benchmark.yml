name: m29-benchmark

on:
  pull_request:
    paths:
      - 'Benchmarks/**'
      - '.github/workflows/m29-benchmark.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m29-benchmark-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  ELAN_VERSION: v4.2.3
  ELAN_SHA256: df0b2b3a439961ffcbb3985214365ffe40f49bc871df04dff268c7d8e21ca8b2

jobs:
  build-scaling:
    name: benchmark / build-scaling
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact benchmark revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install checksum-pinned Elan
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/elan-x86_64-unknown-linux-gnu.tar.gz"
          curl --fail --location --retry 3 --output "$archive" \
            "https://github.com/leanprover/elan/releases/download/${ELAN_VERSION}/elan-x86_64-unknown-linux-gnu.tar.gz"
          echo "${ELAN_SHA256}  ${archive}" | sha256sum --check -
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/elan-init" -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Run governed synthetic build benchmark
        shell: bash
        env:
          BENCH_SIZES: '8 32 128'
          BENCH_REPETITIONS: '3'
          BENCH_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BENCH_INTEGRATION_SHA: ${{ github.sha }}
        run: bash Benchmarks/run-build-scaling.sh

      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: m29-build-scaling-${{ github.run_id }}-${{ github.run_attempt }}
          path: .lake/build/benchmarks/results/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 30
