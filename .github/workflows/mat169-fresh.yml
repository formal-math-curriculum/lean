name: MAT-169 fresh reproduction

on:
  push:
    branches:
      - agent/mat169-fresh-verification

env:
  SUBJECT_SHA: 21ac6ccf5124854dfdf9815614d651ceda8ad063

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact MAT-168 subject revision
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SUBJECT_SHA }}

      - name: Assert clean project cache state
        shell: bash
        run: |
          test ! -d .lake
          test "$(git rev-parse HEAD)" = "$SUBJECT_SHA"

      - name: Install elan
        shell: bash
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Verify effective selected toolchain
        shell: bash
        run: |
          elan show
          lean --version | tee /tmp/lean-version.txt
          lake --version | tee /tmp/lake-version.txt
          grep -q 'version 4.33.0' /tmp/lean-version.txt
          grep -q 'Lean version 4.33.0' /tmp/lake-version.txt
          test "$(tr -d '\r\n' < lean-toolchain)" = 'leanprover/lean4:v4.33.0'

      - name: Resolve dependencies without mathlib cache download
        shell: bash
        env:
          MATHLIB_NO_CACHE_ON_UPDATE: "1"
        run: |
          lake update
          git diff --exit-code -- lean-toolchain lake-manifest.json
          grep -q 'db584cd6d46c92f209a44c0f1c829460d327499d' lake-manifest.json
          test ! -e .lake/packages/mathlib/.lake/build/lib/lean/Mathlib/Data/Nat/Basic.olean

      - name: Cold build complete FormalMath library
        shell: bash
        env:
          MATHLIB_NO_CACHE_ON_UPDATE: "1"
        run: |
          lake build FormalMath
          test -e .lake/build/lib/lean/FormalMath.olean
          test -e .lake/build/lib/lean/FormalMath/Basic.olean

      - name: Prove effective-toolchain override drift is detectable and recoverable
        shell: bash
        run: |
          elan toolchain install leanprover/lean4:v4.32.2
          elan override set leanprover/lean4:v4.32.2
          lean --version | tee /tmp/drifted-lean-version.txt
          grep -q 'version 4.32.2' /tmp/drifted-lean-version.txt
          test "$(tr -d '\r\n' < lean-toolchain)" = 'leanprover/lean4:v4.33.0'
          if grep -q 'version 4.33.0' /tmp/drifted-lean-version.txt; then
            echo 'Expected toolchain drift was not observed' >&2
            exit 1
          fi
          echo 'Detected: effective Lean differs from repository lean-toolchain.'
          elan override unset
          lean --version | tee /tmp/recovered-lean-version.txt
          grep -q 'version 4.33.0' /tmp/recovered-lean-version.txt
