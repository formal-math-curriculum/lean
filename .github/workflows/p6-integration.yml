name: p6-integration

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "Benchmarks/**"
      - "FormalMath.lean"
      - "FormalMath/**"
      - "Quality/**"
      - "QualityTests.lean"
      - "QualityTests/**"
      - "Traceability.lean"
      - "Traceability/**"
      - "TraceabilityCli.lean"
      - "metadata/**"
      - "publication/**"
      - "lake-manifest.json"
      - "lakefile.toml"
      - "lean-toolchain"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - "Benchmarks/**"
      - "FormalMath.lean"
      - "FormalMath/**"
      - "Quality/**"
      - "QualityTests.lean"
      - "QualityTests/**"
      - "Traceability.lean"
      - "Traceability/**"
      - "TraceabilityCli.lean"
      - "metadata/**"
      - "publication/**"
      - "lake-manifest.json"
      - "lakefile.toml"
      - "lean-toolchain"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p6-integration-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  ELAN_VERSION: v4.2.3
  ELAN_SHA256: df0b2b3a439961ffcbb3985214365ffe40f49bc871df04dff268c7d8e21ca8b2

jobs:
  integration-performance:
    name: p6-integration / performance
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact integration revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install checksum-pinned Elan
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/elan-x86_64-unknown-linux-gnu.tar.gz"
          curl --fail --location --retry 3 --output "$archive" \
            "https://github.com/leanprover/elan/releases/download/${ELAN_VERSION}/elan-x86_64-unknown-linux-gnu.tar.gz"
          echo "${ELAN_SHA256}  ${archive}" | sha256sum --check -
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/elan-init" -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Validate selected environment and warm upstream cache
        shell: bash
        run: bash Quality/quality.sh env

      - name: Run fail-closed integration controls
        shell: bash
        run: bash Quality/check-p6-integration-controls.sh

      - name: Measure bounded production integration workloads
        shell: bash
        env:
          P6_INTEGRATION_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          P6_INTEGRATION_INTEGRATION_SHA: ${{ github.sha }}
        run: bash Benchmarks/run-p6-integration.sh

      - name: Upload revision-bound integration evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: p6-integration-${{ github.run_id }}-${{ github.run_attempt }}
          path: .lake/build/p6-integration/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 30
