name: MAT-178 regression and anti-conflation validation

on:
  push:
    branches:
      - agent/regression-quality-harness

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        shell: bash
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Verify environment and resolved dependency state
        shell: bash
        run: |
          lean --version
          lake --version
          lake update
          git diff --exit-code -- lean-toolchain lakefile.toml lake-manifest.json
          lake exe cache get

      - name: Run M2.6 regression and negative-control harness
        shell: bash
        run: bash Quality/run-regression-tests.sh
