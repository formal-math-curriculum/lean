name: MAT-176 proof assurance validation

on:
  push:
    branches:
      - agent/testing-quality-gates

jobs:
  assurance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        shell: bash
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Verify environment and resolve without mathlib cache download
        shell: bash
        env:
          MATHLIB_NO_CACHE_ON_UPDATE: "1"
        run: |
          lean --version
          lake --version
          lake update
          git diff --exit-code -- lean-toolchain lakefile.toml lake-manifest.json

      - name: Strict production build
        shell: bash
        env:
          MATHLIB_NO_CACHE_ON_UPDATE: "1"
        run: lake build --wfail FormalMath

      - name: Production module-origin axiom audit
        shell: bash
        run: lake env lean --error=warning Quality/RunAxiomAudit.lean

      - name: Standard mathematical axiom positive control
        shell: bash
        run: lake env lean --error=warning Quality/Fixtures/StandardAxiom.lean

      - name: Direct sorry warning negative control
        shell: bash
        run: |
          set +e
          output=$(lake env lean --error=warning Quality/Fixtures/SorryWarning.lean 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -ne 0
          printf '%s\n' "$output" | grep -q "uses 'sorry'"

      - name: Transitive sorryAx negative control
        shell: bash
        run: |
          set +e
          output=$(lake env lean Quality/Fixtures/SorryAxiom.lean 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -ne 0
          printf '%s\n' "$output" | grep -q 'unfinished=\[sorryAx\]'
          printf '%s\n' "$output" | grep -q 'formal mathematics axiom audit failed'

      - name: Custom axiom negative control
        shell: bash
        run: |
          set +e
          output=$(lake env lean Quality/Fixtures/CustomAxiom.lean 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -ne 0
          printf '%s\n' "$output" | grep -q 'custom-or-unclassified'
          printf '%s\n' "$output" | grep -q 'formal mathematics axiom audit failed'
